server:
  # 管理端 API 监听地址
  admin_addr: ":8001"
  # 用户端 API 监听地址
  api_addr: ":8002"
  # HTTP 防慢请求与连接占用配置（秒）
  read_header_timeout_seconds: 5
  read_timeout_seconds: 60
  write_timeout_seconds: 60
  idle_timeout_seconds: 120
  shutdown_timeout_seconds: 15

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "your-mysql-password"
  database: "backend_frame"
  max_open_conns: 50
  max_idle_conns: 10

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

jwt:
  # 签名密钥，请替换为随机字符串（例如：openssl rand -hex 32）
  secret: "secret-key"
  # token 有效期（小时）
  expire_hours: 24
  # 签发方
  issuer: "go_backend_frame"

log:
  level: "info" # debug | info | warn | error
