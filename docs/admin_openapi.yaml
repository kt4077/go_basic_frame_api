  ########################## 文件上传 ##########################
  /admin/upload/file:
    post:
      tags: [文件上传]
      summary: 上传文件
      description: |
        multipart/form-data，字段名固定为 `file`，单文件最大 50MB。
        文件会写入当前默认存储渠道，并在 `sys_upload_file` 记录上传档案；
        响应的 `url` 按当前默认存储配置动态生成。
      operationId: adminUploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传文件（最大 50MB）
              required: [file]
      responses:
        '200':
          description: 上传结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FileResponse'

