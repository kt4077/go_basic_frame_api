openapi: 3.0.3

info:
  title: server_api 管理端 API
  description: |
    Go + Gin + GORM(MySQL) + Redis + JWT 后台管理端接口文档。

    ## 通用约定
    - 管理端默认监听 `http://127.0.0.1:8001`，所有业务路径以 `/admin` 开头。
    - 除登录、公开平台配置、静态文件访问外，其余接口均需在请求头携带
      `Authorization: Bearer <token>`（登录接口返回的 `token`）。
    - 管理端业务接口还会校验**接口级权限**：菜单/按钮通过 `api_path` 绑定接口，
      格式为 `METHOD:/path`（如 `POST:/admin/user/add`）。超级管理员直接放行。
    - 权限不足返回业务码 `403`；Redis 等依赖异常返回 `503`。

    ## 统一响应结构
    ```json
    { "code": 0, "msg": "success", "data": {} }
    ```
    HTTP 状态码恒为 200，通过 `code` 判断业务结果：

    | code | 含义 |
    | --- | --- |
    | 0 | 成功 |
    | 400 | 参数错误 |
    | 401 | 未登录或登录已失效 |
    | 403 | 无接口权限 |
    | 500 | 业务处理失败（msg 返回具体原因） |
    | 503 | 依赖服务（Redis/数据库）暂时不可用 |

    ## 通用枚举
    - 启用状态 status：1 启用、2 禁用
    - 用户性别 gender：1 男、2 女、3 未知
    - 用户注册来源 register_source：1 微信小程序、2 微信公众号、3 iOS、4 Android
    - 菜单类型 type：1 目录、2 菜单页面、3 按钮
    - 菜单显示状态 status：1 显示、2 隐藏
    - 短信服务商 provider：1 阿里云、2 腾讯云、3 短信宝、4 SMS.cn、5 云片
    - 短信默认渠道 is_default：0 否、1 是（布尔标志例外）
    - 短信模板类型 type：1 验证码、2 通知、3 营销
    - 短信发送状态 status：1 待发送、2 成功、3 失败
    - 微信应用类型 type：1 公众号、2 开放平台、3 小程序
    - 支付渠道 channel：1 微信支付、2 支付宝
    - 存储渠道 channel：local 本地、alioss 阿里云OSS、cos 腾讯云COS、qiniu 七牛云Kodo、minio MinIO/S3
    - 是否超级管理员 is_super：0 否、1 是（超级管理员拥有全部权限）
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8001
    description: 本地开发环境（管理端）
  - url: http://localhost:8001
    description: 本地开发环境（localhost）
  - url: /
    description: 自定义网关/域名（导入 Apifox 后可在环境里配置 baseURL）

security:
  - bearerAuth: []

tags:
  - name: 登录与会话
    description: 登录、退出、当前用户信息、个人资料、修改密码、菜单路由与接口权限
  - name: 系统总览
    description: 首页统计卡片、登录趋势、最近登录、部门用户分布
  - name: 菜单管理
    description: 菜单/目录/按钮的列表、树、增删改
  - name: 角色管理
    description: 角色增删改查、角色树、分配菜单、查看角色用户
  - name: 用户管理
    description: 管理员账号的增删改查、重置密码、踢下线
  - name: 系统用户
    description: C端会员用户的查询展示与账号启用/禁用
  - name: 部门管理
    description: 部门树与增删改
  - name: 文件上传
    description: 通用文件上传（multipart，字段名 file，单文件最大 50MB）
  - name: 操作日志
    description: 管理端操作日志分页查询
  - name: 插件管理
    description: 已安装插件、编译状态、迁移记录和启停状态管理
  - name: 存储渠道
    description: 对象存储渠道配置（本地/阿里云OSS/腾讯云COS/七牛云/MinIO）
  - name: 短信配置
    description: 短信服务商配置、签名、模板与发送记录
  - name: 微信配置
    description: 微信公众号/开放平台/小程序配置
  - name: 支付配置
    description: 微信支付/支付宝渠道配置
  - name: 平台配置
    description: 管理端 Logo/系统名称、用户端默认昵称/头像
  - name: 文件访问
    description: 本地存储文件的公开访问入口

paths:
  ########################## 文件访问 ##########################
  /files/{filepath}:
    get:
      tags: [文件访问]
      summary: 访问上传的本地文件
      description: |
        仅当默认存储渠道为本地存储（local）时适用，直接返回文件内容。
        云存储渠道请通过其访问域名访问。
      operationId: getFile
      security: []
      parameters:
        - name: filepath
          in: path
          required: true
          description: 文件相对路径，如 2026/09/23/xxx.png
          schema:
            type: string
          example: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 文件不存在

  ########################## 登录与会话 ##########################
  /admin/login:
    post:
      tags: [登录与会话]
      summary: 管理端登录
      description: |
        校验账号密码后签发 JWT，并在 Redis 写入 `login:<login_id>` 实现主动过期。
        账号被禁用时返回业务错误。
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
            example:
              username: admin
              password: "123456"
      responses:
        '200':
          description: 登录结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginRes'
              example:
                code: 0
                msg: success
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /admin/logout:
    post:
      tags: [登录与会话]
      summary: 退出登录
      description: 删除当前登录会话的 Redis Key，JWT 立即失效。
      operationId: adminLogout
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                code: 0
                msg: success

  /admin/me:
    get:
      tags: [登录与会话]
      summary: 当前登录用户信息
      operationId: adminMe
      responses:
        '200':
          description: 当前用户信息（含角色列表）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserItem'

  /admin/profile/update:
    post:
      tags: [登录与会话]
      summary: 修改当前管理员个人资料
      description: 仅可修改昵称、头像、手机号、邮箱，不能修改权限、部门与账号状态。
      operationId: adminUpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateReq'
            example:
              nickname: 超级管理员
              avatar: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
              mobile: "13800138000"
              email: admin@example.com
      responses:
        '200':
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserItem'

  /admin/profile/avatar:
    post:
      tags: [登录与会话]
      summary: 单独修改当前管理员头像
      description: 只更新头像字段，不影响其他未保存的个人资料。
      operationId: adminUpdateAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUpdateReq'
            example:
              avatar: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
      responses:
        '200':
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserItem'

  /admin/routers:
    get:
      tags: [登录与会话]
      summary: 当前用户的菜单树（前端路由）
      description: |
        返回目录 + 菜单页面（不含按钮）的树形结构，用于渲染侧边导航。
        超级管理员返回全部显示中的菜单。
      operationId: adminGetRouters
      responses:
        '200':
          description: 菜单树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuTreeItem'

  /admin/permissions:
    get:
      tags: [登录与会话]
      summary: 当前用户的接口权限列表
      description: |
        返回当前用户拥有的接口权限集合（格式 `METHOD:/path`），用于前端按钮显隐。
        超级管理员返回 `["*"]`。
      operationId: adminPermissions
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
              example:
                code: 0
                msg: success
                data:
                  - GET:/admin/user/list
                  - POST:/admin/user/add
                  - POST:/admin/user/update

  /admin/change_password:
    post:
      tags: [登录与会话]
      summary: 修改当前管理员密码
      description: 修改成功后会踢掉该账号所有在线会话，需要重新登录。
      operationId: adminChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordReq'
            example:
              old_password: "123456"
              new_password: "654321"
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  ########################## 系统总览 ##########################
  /admin/dashboard/overview:
    get:
      tags: [系统总览]
      summary: 系统总览统计
      operationId: adminDashboardOverview
      responses:
        '200':
          description: 总览数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OverviewRes'

  ########################## 菜单管理 ##########################
  /admin/menu/list:
    get:
      tags: [菜单管理]
      summary: 菜单列表（平铺）
      operationId: adminMenuList
      parameters:
        - name: name
          in: query
          description: 菜单名称（模糊匹配）
          schema:
            type: string
        - name: type
          in: query
          description: 菜单类型 1目录 2菜单 3按钮
          schema:
            type: integer
            enum: [1, 2, 3]
      responses:
        '200':
          description: 菜单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuItem'

  /admin/menu/tree:
    get:
      tags: [菜单管理]
      summary: 菜单树
      operationId: adminMenuTree
      responses:
        '200':
          description: 菜单树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuTreeItem'

  /admin/menu/add:
    post:
      tags: [菜单管理]
      summary: 新增菜单/按钮
      description: 类型为按钮（type=3）时，`api_path` 必填，需绑定后端接口地址。
      operationId: adminMenuCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuSaveReq'
            example:
              name: 用户管理
              type: 2
              parent_id: 0
              path: /system/user
              icon: User
              sort: 1
              status: 1
              remark: 用户管理页面
      responses:
        '200':
          description: 新增后的菜单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MenuItem'

  /admin/menu/update:
    post:
      tags: [菜单管理]
      summary: 修改菜单/按钮
      description: |
        必须传 id；上级菜单不能选择自身或其子孙节点。
        菜单变更后会自动清除全部权限缓存。
      operationId: adminMenuUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuSaveReq'
            example:
              id: 10
              name: 用户管理
              type: 2
              parent_id: 1
              path: /system/user
              sort: 1
              status: 1
      responses:
        '200':
          description: 修改后的菜单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MenuItem'

  /admin/menu/delete:
    post:
      tags: [菜单管理]
      summary: 删除菜单/按钮
      description: 存在子级或已被角色绑定时不允许删除。
      operationId: adminMenuDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDReq'
            example:
              id: 10
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  ########################## 角色管理 ##########################
  /admin/role/list:
    get:
      tags: [角色管理]
      summary: 角色分页列表
      operationId: adminRoleList
      parameters:
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleListRes'

  /admin/role/tree:
    get:
      tags: [角色管理]
      summary: 角色树
      description: 角色通过 parent_id 构成树，上级角色自动继承后代角色的权限。
      operationId: adminRoleTree
      responses:
        '200':
          description: 角色树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoleTreeItem'

  /admin/role/add:
    post:
      tags: [角色管理]
      summary: 新增角色
      operationId: adminRoleCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSaveReq'
            example:
              name: 运营专员
              code: operator
              parent_id: 0
              sort: 1
              status: 1
              remark: 仅系统总览权限
      responses:
        '200':
          description: 新增后的角色
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleItem'

  /admin/role/update:
    post:
      tags: [角色管理]
      summary: 修改角色
      operationId: adminRoleUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSaveReq'
            example:
              id: 2
              name: 运营专员
              code: operator
              parent_id: 1
              sort: 1
              status: 1
      responses:
        '200':
          description: 修改后的角色
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoleItem'

  /admin/role/delete:
    post:
      tags: [角色管理]
      summary: 删除角色
      operationId: adminRoleDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDReq'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /admin/role/menus:
    get:
      tags: [角色管理]
      summary: 查询角色已绑定的菜单/按钮 ID
      operationId: adminRoleMenuIDs
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          description: 菜单ID列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: integer
              example:
                code: 0
                msg: success
                data: [1, 2, 10, 11]

  /admin/role/assign_menus:
    post:
      tags: [角色管理]
      summary: 给角色分配菜单/按钮权限
      description: 全量覆盖式分配，menu_ids 为空表示清空该角色权限。
      operationId: adminRoleAssignMenus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMenusReq'
            example:
              role_id: 2
              menu_ids: [1, 2, 10, 11]
      responses:
        '200':
          description: 分配成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /admin/role/users:
    get:
      tags: [角色管理]
      summary: 查询角色下的用户 ID
      operationId: adminRoleUserIDs
      parameters:
        - $ref: '#/components/parameters/IDQuery'
      responses:
        '200':
          description: 用户ID列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: integer

  ########################## 用户管理 ##########################
  /admin/user/list:
    get:
      tags: [用户管理]
      summary: 用户分页列表
      operationId: adminUserList
      parameters:
        - name: keyword
          in: query
          description: 搜索关键字（账号/昵称/手机号）
          schema:
            type: string
        - name: status
          in: query
          description: 状态 1启用 2禁用
          schema:
            type: integer
            enum: [1, 2]
        - name: dept_id
          in: query
          description: 部门ID
          schema:
            type: integer
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserListRes'

  /admin/user/add:
    post:
      tags: [用户管理]
      summary: 新增用户
      operationId: adminUserCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSaveReq'
            example:
              username: lisi
              password: "123456"
              nickname: 李四
              mobile: "13800138001"
              email: lisi@example.com
              dept_id: 1
              status: 1
              is_super: 0
              role_ids: [2]
      responses:
        '200':
          description: 新增后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserItem'

  /admin/user/update:
    post:
      tags: [用户管理]
      summary: 修改用户
      description: 必须传 id；password 为空表示不修改密码。超级管理员不可被禁用或删除。
      operationId: adminUserUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSaveReq'
            example:
              id: 3
              username: lisi
              nickname: 李四
              dept_id: 1
              status: 1
              role_ids: [2, 3]
      responses:
        '200':
          description: 修改后的用户
