        '200':
          description: 配置列表（不返回密钥）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentConfigItem'

  /admin/payment/config/save:
    post:
      tags: [支付配置]
      summary: 新增/修改支付渠道配置
      operationId: adminPaymentConfigSave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfigSaveReq'
            example:
              name: 微信支付-商户号1
              channel: 1
              app_id: wx1234567890abcdef
              merchant_id: "1900000001"
              api_v3_key: xxxxxxxxxxxxxxxxxxxxxxxx
              cert_serial_no: 1234567890ABCDEF
              notify_url: https://api.example.com/pay/notify/wechat
              status: 1
              sort: 1
      responses:
        '200':
          description: 保存后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentConfigItem'

  /admin/payment/config/delete:
    post:
      tags: [支付配置]
      summary: 删除支付渠道配置
      operationId: adminPaymentConfigDelete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDReq'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  ########################## 平台配置 ##########################
  /admin/platform/public:
    get:
      tags: [平台配置]
      summary: 查询管理端公开配置（无需登录）
      description: 登录页展示用，返回系统名称与 Logo 访问地址。
      operationId: adminPlatformPublicDetail
      security: []
      responses:
        '200':
          description: 管理端平台配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminPlatformConfigRes'

  /admin/platform/admin/detail:
    get:
      tags: [平台配置]
      summary: 查询管理端平台配置
      operationId: adminPlatformAdminDetail
      responses:
        '200':
          description: 管理端平台配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminPlatformConfigRes'

  /admin/platform/admin/save:
    post:
      tags: [平台配置]
      summary: 保存管理端平台配置
      description: 按平台类型 upsert，重复保存不会产生多条记录。
      operationId: adminPlatformSaveAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlatformSaveReq'
            example:
              logo: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
              system_name: 后台管理系统
      responses:
        '200':
          description: 保存后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminPlatformConfigRes'

  /admin/platform/user/detail:
    get:
      tags: [平台配置]
      summary: 查询用户端平台配置
      operationId: adminPlatformUserDetail
      responses:
        '200':
          description: 用户端平台配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPlatformConfigRes'

  /admin/platform/user/save:
    post:
      tags: [平台配置]
      summary: 保存用户端平台配置
      operationId: adminPlatformSaveUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPlatformSaveReq'
            example:
              default_nickname: 新用户
              default_avatar: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
      responses:
        '200':
          description: 保存后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPlatformConfigRes'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录接口返回的 token，请求头格式：Authorization: Bearer <token>'

  parameters:
    PageQuery:
      name: page
      in: query
      description: 页码，默认 1
      schema:
        type: integer
        default: 1
      example: 1
    PageSizeQuery:
      name: page_size
      in: query
      description: 每页数量，默认 20，最大 100
      schema:
        type: integer
        default: 20
      example: 20
    NameQuery:
      name: name
      in: query
      description: 名称（模糊匹配）
      schema:
        type: string
    IDQuery:
      name: id
      in: query
      required: true
      description: 主键ID
      schema:
        type: integer

  schemas:
    # ---------------- 通用 ----------------
    Response:
      type: object
      description: 统一响应结构（HTTP 状态码恒为 200）
      properties:
        code:
          type: integer
          description: 业务响应码 0成功 400参数错误 401未登录 403无权限 500业务失败 503依赖不可用
          example: 0
        msg:
          type: string
          description: 提示信息，失败时为具体原因
          example: success
        data:
          description: 业务数据，部分接口无 data 字段
          nullable: true
      required: [code, msg]

    IDReq:
      type: object
      description: 主键ID请求体
      properties:
        id:
          type: integer
          description: 主键ID
          example: 1
      required: [id]

    BaseItem:
      type: object
      description: 通用基础字段
      properties:
        id:
          type: integer
          description: 主键ID
          example: 1
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间

    # ---------------- 登录与会话 ----------------
    LoginReq:
      type: object
      properties:
        username:
          type: string
          description: 登录账号
          example: admin
        password:
          type: string
          description: 登录密码
          example: "123456"
      required: [username, password]

    LoginRes:
      type: object
      properties:
        token:
          type: string
          description: 'JWT 访问令牌，携带方式：Authorization: Bearer <token>'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ChangePasswordReq:
      type: object
      properties:
        old_password:
          type: string
          description: 原密码
          example: "123456"
        new_password:
          type: string
          description: 新密码，至少 6 位
          minLength: 6
          example: "654321"
      required: [old_password, new_password]

    ProfileUpdateReq:
      type: object
      properties:
        nickname:
          type: string
          description: 用户昵称，最长 32 字符
          maxLength: 32
          example: 超级管理员
        avatar:
          type: string
          description: 头像相对路径（由上传接口返回）
          maxLength: 1024
          example: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
        mobile:
          type: string
          description: 手机号，最长 16 字符
          maxLength: 16
          example: "13800138000"
        email:
          type: string
          format: email
          description: 邮箱，最长 64 字符
          maxLength: 64
          example: admin@example.com

    AvatarUpdateReq:
      type: object
      properties:
        avatar:
          type: string
          description: 头像相对路径（由上传接口返回）
          maxLength: 1024
          example: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
      required: [avatar]

    # ---------------- 实体 ----------------
    MenuItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 菜单名称
              example: 用户管理
            type:
              type: integer
              description: 类型 1目录 2菜单页面 3按钮
              enum: [1, 2, 3]
            parent_id:
              type: integer
              description: 上级菜单ID，0 为顶级
            path:
              type: string
              description: 前端路由地址
              example: /system/user
            api_path:
              type: string
              description: 接口权限地址，按钮必填，多个用逗号分隔，如 POST:/admin/user/add
              example: POST:/admin/user/add
            icon:
              type: string
              description: 菜单图标
              example: User
            sort:
              type: integer
              description: 排序，越小越靠前
            status:
              type: integer
              description: 显示状态 1显示 2隐藏
              enum: [1, 2]
            remark:
              type: string
              description: 备注

    MenuTreeItem:
      type: object
      description: 菜单树节点
      properties:
        data:
          $ref: '#/components/schemas/MenuItem'
        children:
          type: array
          description: 子级节点
          items:
            $ref: '#/components/schemas/MenuTreeItem'

    RoleItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 角色名称
              example: 运营专员
            code:
              type: string
              description: 角色编码（唯一）
              example: operator
            parent_id:
              type: integer
              description: 上级角色ID，0 为顶级
            sort:
              type: integer
              description: 排序
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            remark:
              type: string
              description: 备注

    RoleTreeItem:
      type: object
      description: 角色树节点
      properties:
        data:
          $ref: '#/components/schemas/RoleItem'
        children:
          type: array
          items:
            $ref: '#/components/schemas/RoleTreeItem'

    UserItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            username:
              type: string
              description: 登录账号
              example: admin
            nickname:
              type: string
              description: 用户昵称
              example: 超级管理员
            avatar:
              type: string
              description: 头像访问地址（按当前默认存储动态生成）
              example: /files/2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
            mobile:
              type: string
              description: 手机号
            email:
              type: string
              description: 邮箱
            dept_id:
              type: integer
              description: 部门ID
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            is_super:
              type: integer
              description: 是否超级管理员 0否 1是
              enum: [0, 1]
            roles:
              type: array
              description: 角色列表
              items:
                $ref: '#/components/schemas/RoleItem'

    MemberItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            sn:
              type: string
              description: 用户编号，全局唯一，cf 前缀 + 8 位小写字母和数字
              example: cfk3m9x2a
            nickname:
              type: string
              description: 昵称
              example: 小小
            real_name:
              type: string
              description: 姓名
              example: 王小民
            account:
              type: string
              description: 登录账号
              example: xiaoxiaomin
            mobile:
              type: string
              description: 手机号，脱敏展示（如 138****8001）
              example: "138****8001"
            avatar:
              type: string
              description: 头像访问地址（按当前默认存储动态生成）
              example: /files/2026/09/25/8f14e45fceea167a5a36dedd4bea2543.png
            gender:
              type: integer
              description: 性别 1男 2女 3未知
              enum: [1, 2, 3]
            age:
              type: integer
              description: 年龄
              example: 26
            birthday:
              type: string
              description: 出生日期，格式 YYYY-MM-DD，未设置为空串
              example: "1999-01-01"
            register_ip:
              type: string
              description: 注册IP
            login_ip:
              type: string
              description: 最近登录IP
            registered_at:
              type: string
              format: date-time
              description: 注册时间，未设置为 null
            logged_at:
              type: string
              format: date-time
              description: 最近登录时间，未设置为 null
            balance:
              type: string
              description: 账户余额，两位小数字符串，避免浮点精度问题
              example: "128.50"
            register_source:
              type: integer
              description: 注册来源 1微信小程序 2微信公众号 3iOS 4Android
              enum: [1, 2, 3, 4]
            status:
              type: integer
              description: 账号状态 1启用 2禁用
              enum: [1, 2]

    DeptItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 部门名称
              example: 技术部
            parent_id:
              type: integer
              description: 上级部门ID，0 为顶级
            sort:
              type: integer
              description: 排序
            leader:
              type: string
              description: 负责人
            remark:
              type: string
              description: 备注

    DeptTreeItem:
      type: object
      description: 部门树节点
      properties:
        data:
          $ref: '#/components/schemas/DeptItem'
        children:
          type: array
          items:
            $ref: '#/components/schemas/DeptTreeItem'

    PluginItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            plugin_id:
              type: string
              description: 插件唯一标识
            name:
              type: string
              description: 插件名称
            version:
              type: string
              description: 数据库安装版本
            code_version:
              type: string
              description: 当前程序编译版本，未编译时为空
            logo:
              type: string
              description: 插件Logo相对路径
            logo_url:
              type: string
              description: 根据当前存储配置补全的插件Logo访问地址
            author:
              type: string
              description: 插件作者
            homepage:
              type: string
              format: uri
              description: 插件主页地址
            description:
              type: string
              description: 插件描述
            status:
              type: integer
              description: 插件状态 1启用 2停用
              enum: [1, 2]
            compiled:
              type: boolean
              description: 是否编译进当前程序

    PluginMigrationItem:
      type: object
      properties:
        id:
          type: integer
          description: 主键ID
        version:
          type: string
          description: 迁移版本
        checksum:
          type: string
          description: 迁移内容SHA256摘要
        status:
          type: integer
          description: 迁移状态 1成功 2失败
          enum: [1, 2]
        execution_ms:
          type: integer
          format: int64
          description: 执行耗时毫秒
        error_message:
          type: string
          description: 失败原因
        executed_at:
          type: string
          format: date-time
          description: 执行时间

    PluginDetail:
      allOf:
        - $ref: '#/components/schemas/PluginItem'
        - type: object
          properties:
            manifest:
              type: string
              description: 安装时插件清单JSON快照
            migrations:
              type: array
              description: 数据库迁移记录
              items:
                $ref: '#/components/schemas/PluginMigrationItem'

    PluginListRes:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/PluginItem'
        total:
          type: integer
          format: int64
          description: 数据总数

    StorageItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 渠道名称
              example: 本地存储
            channel:
              type: string
              description: 渠道类型 local/alioss/cos/qiniu/minio
              enum: [local, alioss, cos, qiniu, minio]
            params:
              type: string
              description: 渠道参数 JSON 字符串
              example: '{"domain":"/files"}'
            is_default:
              type: integer
              description: 是否默认 0否 1是
              enum: [0, 1]
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            sort:
              type: integer
              description: 排序
            remark:
              type: string
              description: 备注

    SMSConfigItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 配置名称
            provider:
              type: integer
              description: 服务商 1阿里云 2腾讯云 3短信宝 4 SMS.cn 5云片
              enum: [1, 2, 3, 4, 5]
            access_key_id:
              type: string
              description: 渠道账号或访问密钥ID（不返回密钥 Secret）
            endpoint:
              type: string
              description: 服务地址
              example: dysmsapi.aliyuncs.com
            is_default:
              type: integer
              description: 是否默认渠道 0否 1是；默认渠道必须启用且全局唯一
              enum: [0, 1]
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            remark:
              type: string
              description: 备注

    SMSSignatureItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            config_id:
              type: integer
              description: 所属短信配置ID
            name:
              type: string
              description: 签名名称
            sign_code:
              type: string
              description: 平台签名编码
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            remark:
              type: string
              description: 备注

    SMSTemplateItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            config_id:
              type: integer
              description: 所属短信配置ID
            name:
              type: string
              description: 模板名称
            template_code:
              type: string
              description: 平台模板编码
              example: SMS_123456789
            type:
              type: integer
              description: 模板类型 1验证码 2通知 3营销
              enum: [1, 2, 3]
            content:
              type: string
              description: 模板内容
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            remark:
              type: string
              description: 备注

    SMSLogItem:
      type: object
      description: 短信发送记录
      properties:
        id:
          type: integer
          description: 主键ID
        created_at:
          type: string
          format: date-time
          description: 记录创建时间
        config_id:
          type: integer
          description: 短信配置ID
        signature_id:
          type: integer
          description: 签名ID
        template_id:
          type: integer
          description: 模板ID
        mobile:
          type: string
          description: 手机号（脱敏展示，如 138****8001）
        content:
          type: string
          description: 发送内容
        status:
          type: integer
          description: 发送状态 1待发送 2成功 3失败
          enum: [1, 2, 3]
        provider_message_id:
          type: string
          description: 服务商消息ID
        error_message:
          type: string
          description: 失败原因
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: 发送时间

    WechatConfigItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 配置名称
            type:
              type: integer
              description: 应用类型 1公众号 2开放平台 3小程序
              enum: [1, 2, 3]
            app_id:
              type: string
              description: 微信AppID（不返回 Secret）
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            remark:
              type: string
              description: 备注

    PaymentConfigItem:
      allOf:
        - $ref: '#/components/schemas/BaseItem'
        - type: object
          properties:
            name:
              type: string
              description: 配置名称
            channel:
              type: integer
              description: 支付渠道 1微信支付 2支付宝
              enum: [1, 2]
            app_id:
              type: string
              description: 应用ID
            merchant_id:
              type: string
              description: 商户号
            cert_serial_no:
              type: string
              description: 证书序列号
            notify_url:
              type: string
              description: 支付回调地址
            status:
              type: integer
              description: 状态 1启用 2禁用
              enum: [1, 2]
            sort:
              type: integer
              description: 排序
            remark:
              type: string
              description: 备注

    OperationLogItem:
      type: object
      description: 操作日志
      properties:
        id:
          type: integer
          description: 主键ID
        created_at:
          type: string
          format: date-time
          description: 操作时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        user_id:
          type: integer
          nullable: true
          description: 操作人ID
        username:
          type: string
          description: 操作账号
        method:
          type: string
          description: 请求方法
          example: POST
        path:
          type: string
          description: 请求路由（ Gin 路由模板）
          example: /admin/user/add
        request_params:
          type: string
          description: 请求参数（敏感字段已脱敏）
        response_params:
          type: string
          description: 响应内容
        ip:
          type: string
          description: 客户端IP
        user_agent:
          type: string
          description: 用户代理
        code:
          type: integer
          description: 业务响应码
        cost_ms:
          type: integer
          format: int64
          description: 耗时（毫秒）
        client:
          type: string
          description: 客户端类型 admin/api

    LoginRecordItem:
      type: object
      description: 登录流水记录
      properties:
        id:
          type: integer
          description: 主键ID
        login_id:
          type: string
          description: 登录标识（UUID）
        user_id:
          type: integer
          description: 用户ID
        username:
          type: string
          description: 登录账号
        client:
          type: string
          description: 客户端类型 admin/api
        login_ip:
          type: string
          description: 登录IP
        user_agent:
          type: string
          description: 用户代理
        login_at:
          type: string
          format: date-time
          description: 登录时间
        logout_at:
          type: string
          format: date-time
          nullable: true
          description: 退出时间
        status:
          type: integer
          description: 登录状态 1在线 2已退出 3被踢下线/禁用
          enum: [1, 2, 3]

    FileResponse:
      type: object
      description: 文件上传结果
      properties:
        id:
          type: integer
          description: 上传记录ID
        file_name:
          type: string
          description: 原始文件名
        hash_name:
          type: string
          description: 哈希文件名
        size:
          type: integer
          format: int64
          description: 文件大小（字节）
        mime_type:
          type: string
          description: MIME 类型
          example: image/png
        relative_path:
          type: string
          description: 文件相对路径（业务字段请保存该值）
          example: 2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png
        absolute_path:
          type: string
          description: 上传时的完整访问地址快照
        url:
          type: string
          description: 当前可访问地址（按默认存储渠道动态生成）
          example: /files/2026/09/23/8f14e45fceea167a5a36dedd4bea2543.png

    # ---------------- 列表响应 ----------------
    MemberListRes:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/MemberItem'
        total:
          type: integer
          format: int64
          description: 数据总数
          example: 36

    UserListRes:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/UserItem'
        total:
          type: integer
          format: int64
          description: 数据总数
          example: 12

    RoleListRes:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/RoleItem'
        total:
          type: integer
          format: int64
          description: 数据总数

    SMSLogListRes:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/SMSLogItem'
        total:
          type: integer
          format: int64
          description: 数据总数

    OperationLogListRes:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/OperationLogItem'
        total:
          type: integer
          format: int64
          description: 数据总数

    # ---------------- 系统总览 ----------------
    TrendItem:
      type: object
      properties:
        name:
          type: string
          description: 统计日期
          example: 09-23
        value:
          type: integer
          format: int64
          description: 统计数量

    DeptUserItem:
      type: object
      properties:
        dept_id:
          type: integer
          description: 部门ID
        name:
          type: string
          description: 部门名称
        total:
          type: integer
          format: int64
          description: 用户数量

    OverviewRes:
      type: object
      description: 系统总览
      properties:
        user_count:
          type: integer
          format: int64
          description: 用户数量
        role_count:
          type: integer
          format: int64
          description: 角色数量
        menu_count:
          type: integer
          format: int64
          description: 菜单数量
        dept_count:
          type: integer
          format: int64
          description: 部门数量
        online_count:
          type: integer
          format: int64
          description: 在线用户数量
        login_trend:
          type: array
          description: 登录趋势
          items:
            $ref: '#/components/schemas/TrendItem'
        recent_login:
          type: array
          description: 最近登录记录
          items:
            $ref: '#/components/schemas/LoginRecordItem'
        dept_users:
          type: array
          description: 部门用户分布
          items:
            $ref: '#/components/schemas/DeptUserItem'

    # ---------------- 平台配置 ----------------
    AdminPlatformConfigRes:
      type: object
      properties:
        logo:
          type: string
          description: Logo 访问地址
        logo_path:
          type: string
          description: Logo 相对路径
        system_name:
          type: string
          description: 系统名称
        version:
          type: string
          description: 系统版本号，来自服务端 config.yaml，未配置时使用编译期内置版本
          example: v0.0.3

    UserPlatformConfigRes:
      type: object
      properties:
        default_nickname:
          type: string
          description: 用户端默认昵称
        default_avatar:
          type: string
          description: 默认头像访问地址
        default_avatar_path:
          type: string
          description: 默认头像相对路径

    AdminPlatformSaveReq:
      type: object
      properties:
        logo:
          type: string
          description: Logo 相对路径（由上传接口返回的 relative_path）
          maxLength: 500
        system_name:
          type: string
          description: 系统名称，最长 100 字符
          maxLength: 100
          example: 后台管理系统
      required: [system_name]

    UserPlatformSaveReq:
      type: object
      properties:
        default_nickname:
          type: string
          description: 默认昵称，最长 100 字符
          maxLength: 100
          example: 新用户
        default_avatar:
          type: string
          description: 默认头像相对路径
          maxLength: 500
      required: [default_nickname]

    # ---------------- 保存请求 ----------------
    MenuSaveReq:
      type: object
      description: 菜单/按钮保存参数（传 id 为修改，不传为新增）
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 菜单名称
        type:
          type: integer
          description: 类型 1目录 2菜单页面 3按钮
          enum: [1, 2, 3]
        parent_id:
          type: integer
          description: 上级菜单ID
        path:
          type: string
          description: 前端路由地址
        api_path:
          type: string
          description: 接口权限地址，按钮必填，多个用逗号分隔
        icon:
          type: string
          description: 菜单图标
        sort:
          type: integer
          description: 排序
        status:
          type: integer
          description: 显示状态 1显示 2隐藏
          enum: [1, 2]
        remark:
          type: string
          description: 备注
      required: [name, type]

    RoleSaveReq:
      type: object
      description: 角色保存参数（传 id 为修改，不传为新增）
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 角色名称
        code:
          type: string
          description: 角色编码（唯一）
        parent_id:
          type: integer
          description: 上级角色ID
        sort:
          type: integer
          description: 排序
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        remark:
          type: string
          description: 备注
      required: [name, code]

    AssignMenusReq:
      type: object
      properties:
        role_id:
          type: integer
          description: 角色ID
          example: 2
        menu_ids:
          type: array
          description: 菜单/按钮ID列表（全量覆盖，空数组表示清空）
          items:
            type: integer
      required: [role_id]

    UserSaveReq:
      type: object
      description: 用户保存参数（传 id 为修改，不传为新增）
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        username:
          type: string
          description: 登录账号，新增时必填
        password:
          type: string
          description: 登录密码，新增时必填；修改时留空表示不修改
        nickname:
          type: string
          description: 用户昵称
        avatar:
          type: string
          description: 头像相对路径
          maxLength: 1024
        mobile:
          type: string
          description: 手机号
        email:
          type: string
          description: 邮箱
        dept_id:
          type: integer
          description: 部门ID
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        is_super:
          type: integer
          description: 是否超级管理员 0否 1是
          enum: [0, 1]
        role_ids:
          type: array
          description: 角色ID列表
          items:
            type: integer

    ResetPasswordReq:
      type: object
      properties:
        id:
          type: integer
          description: 用户ID
          example: 3
        password:
          type: string
          description: 新密码，至少 6 位
          minLength: 6
          example: "654321"
      required: [id, password]

    MemberSetStatusReq:
      type: object
      properties:
        id:
          type: integer
          description: 用户ID
          example: 1
        status:
          type: integer
          description: 目标状态 1启用 2禁用
          enum: [1, 2]
      required: [id, status]

    DeptSaveReq:
      type: object
      description: 部门保存参数（传 id 为修改，不传为新增）
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 部门名称
        parent_id:
          type: integer
          description: 上级部门ID
        sort:
          type: integer
          description: 排序
        leader:
          type: string
          description: 负责人
        remark:
          type: string
          description: 备注
      required: [name]

    PluginStatusReq:
      type: object
      properties:
        plugin_id:
          type: string
          description: 插件唯一标识
        status:
          type: integer
          description: 插件状态 1启用 2停用
          enum: [1, 2]
      required: [plugin_id, status]

    PluginInfoUpdateReq:
      type: object
      properties:
        plugin_id:
          type: string
          description: 插件唯一标识
        logo:
          type: string
          maxLength: 1000
          description: 插件Logo相对路径，也兼容当前存储域名下的完整地址
        author:
          type: string
          maxLength: 100
          description: 插件作者
        homepage:
          type: string
          format: uri
          maxLength: 500
          description: 插件主页地址
        description:
          type: string
          maxLength: 2000
          description: 插件描述
      required: [plugin_id]

    StorageSaveReq:
      type: object
      description: 存储渠道保存参数（传 id 为修改，不传为新增）
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 渠道名称
        channel:
          type: string
          description: 渠道类型，仅支持 local/alioss/cos/qiniu/minio，不在枚举内返回业务错误
          enum: [local, alioss, cos, qiniu, minio]
        params:
          type: string
          description: |
            渠道参数 JSON 字符串。
            local: {"domain":"/files"}
            alioss: {"bucket":"xxx","endpoint":"oss-cn-hangzhou.aliyuncs.com","access_key_id":"...","access_key_secret":"...","domain":"https://cdn.example.com"}
            cos: {"bucket":"xxx-1250000000","region":"ap-guangzhou","secret_id":"...","secret_key":"...","domain":"..."}
            qiniu: {"bucket":"xxx","access_key":"...","secret_key":"...","domain":"https://cdn.example.com"}（domain 必填）
            minio: {"endpoint":"127.0.0.1:9000","bucket":"xxx","access_key":"...","secret_key":"...","domain":"..."}
        is_default:
          type: integer
          description: 是否默认 0否 1是
          enum: [0, 1]
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        sort:
          type: integer
          description: 排序
        remark:
          type: string
          description: 备注
      required: [name, channel]

    SMSConfigSaveReq:
      type: object
      description: 短信服务商配置保存参数
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 配置名称
        provider:
          type: integer
          description: 服务商 1阿里云 2腾讯云 3短信宝 4 SMS.cn 5云片
          enum: [1, 2, 3, 4, 5]
        access_key_id:
          type: string
          description: 阿里云AccessKey ID、腾讯云SDK AppID、短信宝用户名、SMS.cn uid 或云片API Key
        access_key_secret:
          type: string
          description: 阿里云AccessKey Secret、腾讯云Secret Key、短信宝API Key/MD5密码或SMS.cn接口密码；云片无需填写；修改时留空表示不修改
        endpoint:
          type: string
          description: 服务地址
        is_default:
          type: integer
          description: 是否默认渠道 0否 1是；允许多个渠道启用，但只能有一个启用的默认渠道
          enum: [0, 1]
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        remark:
          type: string
          description: 备注
      required: [name, provider, access_key_id, status]

    SMSSignatureSaveReq:
      type: object
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        config_id:
          type: integer
          description: 短信配置ID
        name:
          type: string
          description: 签名名称
        sign_code:
          type: string
          description: 平台签名编码
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        remark:
          type: string
          description: 备注
      required: [config_id, name, status]

    SMSTemplateSaveReq:
      type: object
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        config_id:
          type: integer
          description: 短信配置ID
        name:
          type: string
          description: 模板名称
        template_code:
          type: string
          description: 平台模板编码；短信宝可填写产品ID，云片可留空
        type:
          type: integer
          description: 模板类型 1验证码 2通知 3营销
          enum: [1, 2, 3]
        content:
          type: string
          description: 模板内容
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        remark:
          type: string
          description: 备注
      required: [config_id, name, template_code, type, status]

    WechatConfigSaveReq:
      type: object
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 配置名称
        type:
          type: integer
          description: 应用类型 1公众号 2开放平台 3小程序
          enum: [1, 2, 3]
        app_id:
          type: string
          description: 微信AppID
        app_secret:
          type: string
          description: 微信AppSecret，留空表示不修改
        token:
          type: string
          description: 消息校验Token
        aes_key:
          type: string
          description: 消息加解密密钥
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        remark:
          type: string
          description: 备注
      required: [name, type, app_id, status]

    PaymentConfigSaveReq:
      type: object
      properties:
        id:
          type: integer
          description: 主键ID，新增时不传
        name:
          type: string
          description: 配置名称
        channel:
          type: integer
          description: 支付渠道 1微信支付 2支付宝
          enum: [1, 2]
        app_id:
          type: string
          description: 应用ID
        merchant_id:
          type: string
          description: 商户号
        private_key:
          type: string
          description: 商户私钥（不返回）
        public_key:
          type: string
          description: 平台公钥（不返回）
        api_v3_key:
          type: string
          description: 微信支付 APIv3 密钥（不返回）
        cert_serial_no:
          type: string
          description: 证书序列号
        notify_url:
          type: string
          description: 支付回调地址
        status:
          type: integer
          description: 状态 1启用 2禁用
          enum: [1, 2]
        sort:
          type: integer
          description: 排序
        remark:
          type: string
          description: 备注
      required: [name, channel, app_id, notify_url, status]
